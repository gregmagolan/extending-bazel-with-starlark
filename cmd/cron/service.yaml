# Deployment description for the cron binary.
#
# The Gazelle extension in `tools/gazelle/service_image.axl` reads this file and
# generates the image and push targets from it. Only two keys are read: `name`
# becomes the image label and the push repository, `port` becomes
# `exposed_ports`. The rest is here to look like a real descriptor.
name: cron
port: 8082
replicas: 1
schedule: "*/5 * * * *"
resources:
  cpu: "100m"
  memory: 128Mi
